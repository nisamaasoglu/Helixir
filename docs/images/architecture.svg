<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="360" fill="#1d2126"/>
  <text x="30" y="42" fill="#e6edf3" font-size="22" font-weight="700">Helixir — encryption pipeline</text>
  <text x="30" y="66" fill="#7d8590" font-size="13">Security lives in the AES-256-GCM layer. The DNA layer is a reversible representation, not a cipher.</text>

  <!-- boxes -->
  <g stroke="#30363d" stroke-width="1.5">
    <rect x="30"  y="110" width="150" height="80" rx="8" fill="#22272e"/>
    <rect x="220" y="110" width="170" height="80" rx="8" fill="#22272e"/>
    <rect x="430" y="110" width="170" height="80" rx="8" fill="#1b3a2b"/>
    <rect x="640" y="110" width="230" height="80" rx="8" fill="#22272e"/>
  </g>

  <text x="105" y="146" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600">Input file</text>
  <text x="105" y="168" fill="#7d8590" font-size="12" text-anchor="middle">bytes</text>

  <text x="305" y="140" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600">Key derivation</text>
  <text x="305" y="160" fill="#7d8590" font-size="12" text-anchor="middle">scrypt(passphrase,</text>
  <text x="305" y="176" fill="#7d8590" font-size="12" text-anchor="middle">salt) → 256-bit key</text>

  <text x="515" y="140" fill="#7ee787" font-size="15" text-anchor="middle" font-weight="600">AES-256-GCM</text>
  <text x="515" y="160" fill="#9db7a6" font-size="12" text-anchor="middle">nonce + auth tag</text>
  <text x="515" y="176" fill="#9db7a6" font-size="12" text-anchor="middle">(tamper-evident)</text>

  <text x="755" y="140" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="600">DNA representation</text>
  <text x="755" y="160" fill="#7d8590" font-size="12" text-anchor="middle">2 bits/base → A C G T</text>
  <text x="755" y="176" fill="#7d8590" font-size="12" text-anchor="middle">Watson-Crick complement</text>

  <!-- arrows -->
  <g stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="180" y1="150" x2="216" y2="150"/>
    <line x1="390" y1="150" x2="426" y2="150"/>
    <line x1="600" y1="150" x2="636" y2="150"/>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- outputs -->
  <g stroke="#30363d" stroke-width="1.5">
    <rect x="640" y="230" width="105" height="46" rx="6" fill="#22272e"/>
    <rect x="765" y="230" width="105" height="46" rx="6" fill="#22272e"/>
  </g>
  <text x="692" y="258" fill="#7d8590" font-size="12" text-anchor="middle">.fasta</text>
  <text x="817" y="258" fill="#7d8590" font-size="12" text-anchor="middle">.helix</text>
  <line x1="755" y1="190" x2="755" y2="226" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- audit log -->
  <rect x="220" y="240" width="380" height="60" rx="8" fill="#22272e" stroke="#30363d" stroke-width="1.5"/>
  <text x="410" y="266" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="600">SQLite audit log</text>
  <text x="410" y="286" fill="#7d8590" font-size="12" text-anchor="middle">metadata + ciphertext only — never the passphrase or key</text>
  <line x1="515" y1="190" x2="450" y2="238" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
